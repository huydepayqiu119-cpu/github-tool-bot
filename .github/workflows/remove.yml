name: Remove
on:
  workflow_run:
    workflows: ["Conversion Request"]
    types:
      - completed

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 15
    steps:
      - name: Cleanup old remove runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TOOLS_PAT }}
          script: |
            let page = 1;
            while (true) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'remove.yml',
                status: 'completed',
                per_page: 100,
                page
              });
              if (runs.data.workflow_runs.length === 0) break;
              for (const run of runs.data.workflow_runs) {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                }).catch(() => {});
              }
              if (runs.data.workflow_runs.length < 100) break;
              page++;
            }

      - name: Delete completed workflow run
        uses: actions/github-script@v7
        with:
          script: |
            await new Promise(r => setTimeout(r, 300000));
            await github.rest.actions.deleteWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            });
